syntax = "proto3";

package Bliss;

message PingMessage : ISessionMessage
{
  int32 PacketId = 1;
  int64 LocalTime = 2;
}

message PongMessage : ISessionMessage
{
    int32 PacketId = 1;
    int64 LocalTime = 2;
}

message C2G_EnterLevel : ISessionRequest response : Bliss.G2C_EnterLevel
{
   int32 RpcId = 1;
}


message G2C_EnterLevel : ISessionResponse
{
   int32 RpcId = 1;
   int32 Error = 2; 
   string Message = 3;
}

message TransformSimpleSyncMessage : IActorMessage
{
   int64 ActorId = 1;

   Unity.Mathematics.float3 Position = 2;
   Unity.Mathematics.float4 Rotation = 3;
   Unity.Mathematics.float3 Velocity = 4;
   Unity.Mathematics.float3 AngularVelocity = 5;
}

message PropertySync_Long : IActorMessage
{
   int64 ActorId = 1;
   int32 PropertyIndex = 2;
   int64 Value = 3;
}

message C2R_Login : ISessionRequest response : Bliss.R2C_Login
{
    int32 RpcId = 1;
    string Account = 2;
    string Password = 3;
}

message R2C_Login : ISessionResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
    int64 GateToken = 4;
    string GateAddress = 5;
}

message C2G_Login : ISessionRequest response : Bliss.G2C_Login
{
   int32 RpcId = 1;
   int64 GateToken = 2;
}

message G2C_Login : ISessionResponse
{
   int32 RpcId = 1;
   int32 Error = 2; 
   string Message = 3;
   // 登录成功后返回玩家Id
   int64 PlayerId = 4;
}

message C2G_EnterMap : ISessionRequest response : Bliss.G2C_EnterMap
{
    int32 RpcId = 1;
    int32 MapId = 2;
}

message G2C_EnterMap : ISessionResponse
{
  int32 RpcId = 1;
  int32 Error = 2;
  string Message = 3;
  // 自己的UnitId
  int64 UnitId = 4;
}


message DTOUnitInfo
{
   int64 UnitId = 1;
   int32 ConfigId = 2;
   Unity.Mathematics.float3 Position = 3;
   Unity.Mathematics.quaternion Rotation = 4;
   Bliss.ENetRole LocalRole = 5;
   Bliss.ENetRole RemoteRole = 6;
}


message M2C_CreateMyUnit : IMessage
{
   int64 ActorId = 1;
   DTOUnitInfo Unit = 2;
}

message M2C_CreateUnits : IMessage
{
   int64 ActorId = 1;
   repeated DTOUnitInfo Units = 2;
}

message M2C_ChangeMap : IMessage
{
  int64 ActorId = 1;
  bool IsLogin = 2;
  int32 LevelConfigId = 3;
  int64 LevelId = 4;
}


message DTOGameplayTargetInfo
{
  Unity.Mathematics.float3 Position = 1;
  Unity.Mathematics.float3 Direction = 2;
  int64 EntityId = 3;
}

message DTOBulletInfo
{
  int64 BulletId = 1;
  int32 ConfigId = 2;
  Unity.Mathematics.float3 Position = 3;
  Unity.Mathematics.quaternion Rotation = 4;
  Bliss.ENetRole LocalRole = 5;
  Bliss.ENetRole RemoteRole = 6;
  DTOGameplayTargetInfo TargetInfo = 7;
  int64 RemainingLifetimeMS = 8;
  int64 ShooterEntityId = 9;
}

message M2C_CreateBullets : IMessage
{
  int64 ActorId = 1;
  repeated DTOBulletInfo Bullets = 2;
}

message M2C_CreateSceneActors : IMessage
{
  int64 ActorId = 1;
  repeated Bliss.SceneActorData SceneActors = 2;
}

message M2C_DestroyEntities : IMessage
{
  int64 ActorId = 1;
  repeated int64 EntityIds = 2;
}

message C2M_CharacterMoveData : ILocationMessage response : Bliss.ResponseMessage
{
  int32 RpcId = 1;
  
  repeated CharacterNetworkMoveData MoveData = 2;
  bool bDisableCombinedScopedMove = 3;
  bool bIsDualHybridRootMotionMove = 4;
}

message M2C_AckGoodCharacterMoveData : IMessage
{
  int64 ActorId = 1;
  float TimeStamp = 2;
}

message M2C_CharacterMovementRepData : IMessage
{
  int64 ActorId = 1;
  CharacterRepMovement ReplicatedMovement = 2;
}

message S2C_RootNotReady : ISessionMessage
{
  int32 Error = 1;
  int32 RejectedOpcode = 2;
}